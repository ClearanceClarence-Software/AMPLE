# AMPLE · Apache HTTP Server configuration
#
# AMPLE starts httpd with   -C "Define AMPLE_ROOT C:/ample"   so this file never contains the install path and
# the AMPLE folder can be moved. Edit this file as you like: AMPLE wrote it once and does not touch it again.
# The files marked "generated" below are rewritten by AMPLE when ports, PHP versions or projects change; put
# your own additions in etc/apache/custom/*.conf instead.

Define AMPLE_ETC  "${AMPLE_ROOT}/etc/apache"
Define AMPLE_LOGS "${AMPLE_ROOT}/logs/apache"

ServerRoot "${AMPLE_ROOT}/bin/apache"
ServerName localhost
ServerAdmin admin@localhost
ServerTokens Prod
ServerSignature Off

# Generated: Listen lines for the ports set in AMPLE.
Include "${AMPLE_ETC}/ports.conf"

# ── Modules ────────────────────────────────────────────────────────────────
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule actions_module modules/mod_actions.so
LoadModule alias_module modules/mod_alias.so
LoadModule allowmethods_module modules/mod_allowmethods.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule expires_module modules/mod_expires.so
LoadModule fcgid_module modules/mod_fcgid.so
LoadModule filter_module modules/mod_filter.so
LoadModule headers_module modules/mod_headers.so
LoadModule include_module modules/mod_include.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule negotiation_module modules/mod_negotiation.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule status_module modules/mod_status.so
LoadModule version_module modules/mod_version.so

# ── Access defaults ────────────────────────────────────────────────────────
<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Files ".ht*">
    Require all denied
</Files>

# ── localhost ──────────────────────────────────────────────────────────────
DocumentRoot "${AMPLE_ROOT}/www"
<Directory "${AMPLE_ROOT}/www">
    Options Indexes FollowSymLinks ExecCGI
    AllowOverride All
    Require all granted
</Directory>

# Projects live here by default; each one also gets its own virtual host in projects.conf.
<Directory "${AMPLE_ROOT}/projects">
    Options Indexes FollowSymLinks ExecCGI
    AllowOverride All
    Require all granted
</Directory>

<IfModule dir_module>
    DirectoryIndex index.php index.html
</IfModule>

# ── Logging ────────────────────────────────────────────────────────────────
ErrorLog "${AMPLE_LOGS}/error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "${AMPLE_LOGS}/access.log" combined

# ── Types and encodings ────────────────────────────────────────────────────
TypesConfig conf/mime.types
AddType application/x-compress .Z
AddType application/x-gzip .gz .tgz
AddDefaultCharset UTF-8
EnableSendfile Off
EnableMMAP Off

<IfModule deflate_module>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml
</IfModule>

# ── Generated by AMPLE ─────────────────────────────────────────────────────
# PHP through mod_fcgid, with the default version; projects can pick their own version in projects.conf.
Include "${AMPLE_ETC}/php.conf"
# /ledger and /phpmyadmin, reachable from this computer only.
Include "${AMPLE_ETC}/apps.conf"
# HTTPS on localhost with AMPLE's local certificate.
Include "${AMPLE_ETC}/ssl.conf"
# One virtual host per project.
Include "${AMPLE_ETC}/projects.conf"

# ── Yours ──────────────────────────────────────────────────────────────────
IncludeOptional "${AMPLE_ETC}/custom/*.conf"
