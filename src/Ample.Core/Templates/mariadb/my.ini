# AMPLE · MariaDB configuration
#
# Written by AMPLE for the folder ${AMPLE_ROOT}. When the AMPLE folder moves or another MariaDB version is made
# active, AMPLE updates basedir, datadir and pid-file below and leaves everything else as you wrote it.

[client]
port=${MARIADB_PORT}
default-character-set=utf8mb4

[mysqld]
port=${MARIADB_PORT}
bind-address=127.0.0.1
basedir="${AMPLE_ROOT}/bin/mariadb/${MARIADB_VERSION}"
datadir="${AMPLE_ROOT}/data/mariadb/${MARIADB_VERSION}"
tmpdir="${AMPLE_ROOT}/tmp"
log_error="${AMPLE_ROOT}/logs/mariadb/error.log"
pid-file="${AMPLE_ROOT}/data/mariadb/${MARIADB_VERSION}/mariadb.pid"

character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
skip-name-resolve
max_allowed_packet=256M
max_connections=100

# InnoDB sized for a development machine, not a server.
innodb_buffer_pool_size=256M
innodb_log_file_size=64M
innodb_flush_log_at_trx_commit=2
innodb_file_per_table=1

# Local development: no binary log, and the strict SQL mode most frameworks expect.
skip-log-bin
sql_mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION

[mariadb-dump]
quick
max_allowed_packet=256M
